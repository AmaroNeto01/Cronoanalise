<style>
/* App de cronoanálise: barra superior grafite com a marca, conteúdo em listas agrupadas, barra de abas inferior fixa, botão de marcação grande no alcance do polegar */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --ink:#1B2329; --muted:#5D6B75; --line:#DADFE3; --sep:#E6E9EC;
  --bar:#1C2328; --bar-ink:#F3F5F6; --bar-muted:#9AA7B0;

  --ok:#2F7D4A; --ok-soft:#DFF0E4; --warn:#A35A00; --warn-soft:#FBEBD5; --bad:#B23A32; --bad-ink:#FFFFFF; --bad-soft:#F8E0DE;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px; --tabh:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#192025; --ink:#E6EBEE; --muted:#97A5AE; --line:#2C363D; --sep:#252E34;
  --bar:#141A1E; --bar-ink:#E6EBEE; --bar-muted:#8C99A2;
  --accent:#F0A23A; --accent-ink:#1B1406; --accent-soft:#3A2A14; --tab-on:#F0A23A;
  --ok:#6CC58A; --ok-soft:#1D3325; --warn:#F0A23A; --warn-soft:#3A2A14; --bad:#F08A80; --bad-ink:#2A0E0B; --bad-soft:#3D2220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#192025; --ink:#E6EBEE; --muted:#97A5AE; --line:#2C363D; --sep:#252E34;
  --bar:#141A1E; --bar-ink:#E6EBEE; --bar-muted:#8C99A2;
  --accent:#F0A23A; --accent-ink:#1B1406; --accent-soft:#3A2A14; --tab-on:#F0A23A;
  --ok:#6CC58A; --ok-soft:#1D3325; --warn:#F0A23A; --warn-soft:#3A2A14; --bad:#F08A80; --bad-ink:#2A0E0B; --bad-soft:#3D2220;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bar)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;overscroll-behavior-y:none;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:1.1rem}
p{margin:0}
.label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num,.big,.kpi .v,.kv b,.read .t,td.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type="checkbox"]{width:22px;height:22px;padding:0;accent-color:var(--accent);flex:none}

.ic{flex:none;display:block}

/* barra superior */
.bar{position:sticky;top:0;z-index:10;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 max(8px,env(safe-area-inset-left)) 0 max(8px,env(safe-area-inset-left));max-width:820px;margin:0 auto}
.bar-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem;color:var(--bar-muted);padding-left:8px}
.bar-brand .ic{color:var(--accent)}
.bar-sp{flex:1}
.bar-btn{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--bar-ink);min-height:44px;min-width:44px;justify-content:center;border-radius:10px;padding:0 6px}
.bar-btn:active{background:rgba(255,255,255,.08)}

.bar-btn[aria-disabled="true"]{opacity:.4}
.bar-title{display:grid;min-width:0;flex:3;text-align:center;margin-right:44px}

.tabbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);vertical-align:middle;margin-left:2px;font-style:normal}

/* conteúdo */
.wrap{max-width:820px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
.panel{display:grid;gap:16px}

.btn.nc{color:var(--bad);border:2px solid var(--bad);background:var(--surface);min-height:56px;font-size:1.05rem;font-weight:800;letter-spacing:.02em}

.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:.82rem;text-transform:none;letter-spacing:0;padding:4px}

/* listas agrupadas */
.group{display:grid;gap:6px}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 6px}
.group-h > span{font-variant-numeric:tabular-nums}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 12px 12px 16px;min-height:60px;border-top:1px solid var(--sep);color:var(--ink)}
.item:first-child{border-top:0}

.check-item{cursor:pointer}
.search{border-radius:12px;background:var(--surface);border-color:transparent}
.banner{display:flex;align-items:center;gap:12px;border:0;border-radius:var(--r);background:var(--bad-soft);color:var(--ink);padding:12px 14px;text-align:left;width:100%}
.banner .ic:first-child{color:var(--bad)}

.seg{display:flex;background:var(--sep);border-radius:10px;padding:3px;gap:2px;overflow-x:auto}

.tags{display:flex;gap:6px;flex-wrap:wrap}

.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.start{display:grid;gap:12px}
.start input{font-size:1.4rem;padding:12px;font-variant-numeric:tabular-nums}

.cyc{border-radius:12px;background:var(--surface);overflow:hidden}

.read.abn{background:var(--warn-soft)}

.chip.add{border-style:dashed;color:var(--bad);border-color:var(--bad)}

/* resultados */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

<script>
window.CronoCore=(function(){
"use strict";
const UNIDADES=[["peças","Peças"],["linhas","Linhas"],["t","Toneladas (t)"],["kg","Quilos (kg)"],["caixas","Caixas"],["volumes","Volumes"],["pedidos","Pedidos"],["ciclos","Ciclos (1 por ciclo)"],["outra","Outra…"]];
const SING={linhas:"linha","peças":"peça",t:"t",kg:"kg",caixas:"caixa",volumes:"volume",pedidos:"pedido",ciclos:"ciclo"};
const NC_PADRAO=["Falta de material","Falta de equipamento ou ferramenta","Material ou local errado","Item avariado ou com defeito","Divergência de quantidade","Sistema ou máquina parada","Espera ou interferência","Retrabalho","Outros"];
const NC_ANTIGOS=["Equipamento ou sistema"];
const TURNOS=["1º turno","2º turno","3º turno","Administrativo"];

function normalize(s){
  if(s.unidade==null)s.unidade="peças";
  if(s.unidadeOutra==null)s.unidadeOutra="";
  if(s.pessoas==null||s.pessoas==="")s.pessoas=1;
  if(s.demanda==null)s.demanda="";
  if(s.horasDia==null||s.horasDia==="")s.horasDia=6.3;
  if(s.turno==null)s.turno="";
  if(s.perfil==null)s.perfil="";
  if(s.ncExclui==null)s.ncExclui=true;
  if(!Array.isArray(s.tiposNC))s.tiposNC=NC_PADRAO.slice();
  if(!Array.isArray(s.elementos)||!s.elementos.length)s.elementos=[{id:"e"+Date.now().toString(36),nome:"Elemento 1",ritmo:100}];
  if(!Array.isArray(s.ciclos))s.ciclos=[];
  s.ciclos.forEach((c,i)=>{
    if(!Array.isArray(c.leituras))c.leituras=[];
    if(!Array.isArray(c.ncs))c.ncs=[];
    if(c.qtd===undefined||c.qtd==="")c.qtd=null;
    if(c.obs==null)c.obs="";
    if(c.n==null)c.n=i+1;
    c.leituras.forEach(l=>{l.t=+l.t||0;l.nc=+l.nc||0;if(l.obs==null)l.obs="";l.anormal=!!l.anormal;l.parcial=!!l.parcial;});
    c.ncs.forEach(x=>{x.t=+x.t||0;if(x.obs==null)x.obs="";if(x.tipo==null)x.tipo="";});
  });
  return s;
}
const unidade=s=>s.unidade==="outra"?(String(s.unidadeOutra||"").trim()||"unid."):s.unidade;
const sing=s=>{const u=unidade(s);return SING[u]||u;};
// Cenário padrão: leituras com NC sempre fora da média (o cenário real as inclui).
const excl=(s,l)=>!!(l.anormal||l.parcial||l.nc>0);
const num=v=>{const n=typeof v==="number"?v:parseFloat(String(v??"").replace(",","."));return Number.isFinite(n)?n:NaN;};

function describe(xs){
  const n=xs.length,sum=xs.reduce((a,b)=>a+b,0),sum2=xs.reduce((a,b)=>a+b*b,0);
  const mean=n?sum/n:NaN;
  const sd=n>1?Math.sqrt(xs.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):NaN;
  const o=xs.slice().sort((a,b)=>a-b);
  const med=n?(n%2?o[(n-1)/2]:(o[n/2-1]+o[n/2])/2):NaN;
  // Tamanho de amostra, 95% de confiança e erro de ±5%: N' = (40·√(nΣx² − (Σx)²) / Σx)²
  const nNec=n>1&&sum>0?Math.ceil(((40*Math.sqrt(Math.max(0,n*sum2-sum*sum)))/sum)**2):NaN;
  return {n,sum,mean,sd,med,min:n?o[0]:NaN,max:n?o[n-1]:NaN,cv:sd/mean*100,nNec};
}

function stats(s){
  // Sem ritmo e sem tolerância: as pausas (PF&D) já estão descontadas nas horas disponíveis por dia.
  const tol=0;
  const N=Math.max(1,num(s.pessoas)||1);
  const horas=num(s.horasDia)||6.3;
  const dem=num(s.demanda);
  const elIds=new Set(s.elementos.map(e=>e.id));

  const rows=s.elementos.map(e=>{
    // Um valor por ciclo: se o elemento foi marcado mais de uma vez no mesmo ciclo, os tempos são somados.
    const xs=[],xr=[];let exc=0,ncN=0;
    s.ciclos.forEach(c=>{const ls=c.leituras.filter(l=>l.elId===e.id);if(!ls.length)return;
      const t=ls.reduce((a,l)=>a+l.t,0);
      if(ls.some(l=>l.nc>0))ncN++;
      if(ls.some(l=>excl(s,l)))exc++;else xs.push(t);
      if(!ls.some(l=>l.anormal||l.parcial))xr.push(t);});
    const d=describe(xs);
    // Cenário real: inclui as leituras com não conformidade (só saem as anormais marcadas e as parciais)
    const meanReal=xr.length?xr.reduce((a,b)=>a+b,0)/xr.length:NaN;
    const ritmo=100;
    const tn=d.mean,tp=tn;
    return Object.assign({e,exc,ncN,ritmo,tn,tp,meanReal},d);
  });
  const sumF=(k)=>rows.reduce((a,r)=>a+(Number.isFinite(r[k])?r[k]:0),0);
  const tmCiclo=sumF("mean"),tnCiclo=sumF("tn"),tpCiclo=sumF("tp");

  const ciclos=s.ciclos.map(c=>{
    const tempo=c.leituras.reduce((a,l)=>a+l.t,0);
    const presentes=new Set(c.leituras.filter(l=>elIds.has(l.elId)&&!l.parcial).map(l=>l.elId));
    const completo=presentes.size===elIds.size;
    const temExcl=c.leituras.some(l=>excl(s,l));
    const q=num(c.qtd)>0?num(c.qtd):null;
    const ncT=c.ncs.reduce((a,x)=>a+x.t,0);
    return {c,n:c.n,tempo,completo,temExcl,q,ncN:c.ncs.length,ncT,
      sUn:q&&tempo?tempo/q:NaN, prodBruta:q&&tempo?q/(tempo*N/3600):NaN,
      valido:!!(completo&&!temExcl&&q)};
  });
  const comQ=ciclos.filter(x=>x.completo&&x.q);
  const qMean=comQ.length?comQ.reduce((a,x)=>a+x.q,0)/comQ.length:NaN;
  const qTot=ciclos.reduce((a,x)=>a+(x.q||0),0);
  const tnUn=tnCiclo>0&&qMean>0?tnCiclo/qMean:NaN;
  const tpUn=tnUn*(1+tol);
  const hhUn=tpUn*N/3600;
  const prod=1/hhUn;
  const capEq=3600/tpUn;
  const capDia=capEq*horas;
  const pessoasNec=dem>0?dem*hhUn/horas:NaN;
  const amostra=describe(ciclos.filter(x=>x.valido).map(x=>x.sUn));
  rows.forEach(x=>{x.pctCiclo=tmCiclo>0?x.mean/tmCiclo*100:NaN;x.porUn=qMean>0?x.mean/qMean:NaN;});
  const cen=(ciclo)=>{const un=ciclo>0&&qMean>0?ciclo/qMean:NaN;const hh=un*N/3600;
    return {ciclo,un,hh,prod:1/hh,capEq:3600/un,capDia:3600/un*horas,pessoasNec:dem>0?dem*hh/horas:NaN};};
  const padrao=cen(tpCiclo);
  const real=cen(rows.reduce((a,r)=>a+(Number.isFinite(r.meanReal)?r.meanReal:0),0));
  const gap={prodPct:padrao.prod>0?(real.prod/padrao.prod-1)*100:NaN,capDia:real.capDia-padrao.capDia,
    pessoas:real.pessoasNec-padrao.pessoasNec,cicloPct:padrao.ciclo>0?(real.ciclo/padrao.ciclo-1)*100:NaN};

  const totalObs=ciclos.reduce((a,x)=>a+x.tempo,0);
  const ncs=[];s.ciclos.forEach(c=>c.ncs.forEach(x=>ncs.push(Object.assign({ciclo:c.n},x))));
  const ncTot=ncs.reduce((a,x)=>a+x.t,0);
  const porTipo={};ncs.forEach(x=>{const k=x.tipo||"Não classificada";(porTipo[k]=porTipo[k]||{tipo:k,n:0,t:0});porTipo[k].n++;porTipo[k].t+=x.t;});
  let acc=0;
  const pareto=Object.values(porTipo).sort((a,b)=>b.t-a.t).map(p=>{acc+=p.t;return Object.assign(p,{media:p.t/p.n,pct:ncTot?p.t/ncTot*100:0,acum:ncTot?acc/ncTot*100:0,pctObs:totalObs?p.t/totalObs*100:0});});
  const porEl=s.elementos.map(e=>{const xs=ncs.filter(x=>x.elId===e.id);return {nome:e.nome,n:xs.length,t:xs.reduce((a,x)=>a+x.t,0)};}).filter(x=>x.n);
  const ciclosAfet=ciclos.filter(x=>x.ncN).length;

  return {tol,N,horas,dem,rows,cenarios:{padrao,real,gap},tmCiclo,tnCiclo,tpCiclo,ciclos,
    completos:ciclos.filter(x=>x.completo).length,comQ:comQ.length,qMean,qTot,tnUn,tpUn,hhUn,prod,capEq,capDia,pessoasNec,amostra,
    nc:{lista:ncs,total:ncTot,n:ncs.length,totalObs,pctObs:totalObs?ncTot/totalObs*100:NaN,ciclosAfet,pctCiclos:ciclos.length?ciclosAfet/ciclos.length*100:NaN,pareto,porEl}};
}

const r=(v,d=2)=>Number.isFinite(v)?Math.round(v*10**d)/10**d:"";
function elNome(s,id){const e=s.elementos.find(x=>x.id===id);return e?e.nome:"(elemento removido)";}

function scen(st,u,u1){
  const P=st.cenarios.padrao,R=st.cenarios.real;
  const line=(l,a,b,d=2,inv)=>[l,r(a,d),r(b,d),r(b-a,d),Number.isFinite(a)&&a?r((b/a-1)*100,1):""];
  return [line("Tempo do ciclo médio (s)",P.ciclo,R.ciclo),line("Tempo por "+u1+" (s)",P.un,R.un),line("Produtividade ("+u+"/h·h)",P.prod,R.prod,1),
    line("Capacidade da equipe por dia ("+u+")",P.capDia,R.capDia,0),line("Pessoas necessárias para a demanda",P.pessoasNec,R.pessoasNec)];
}
function sheets(s){
  const st=stats(s),u=unidade(s),u1=sing(s);
  const situ=(n,need)=>Number.isFinite(need)?(n>=need?"Suficiente":"Faltam "+(need-n)):"Leituras insuficientes";

  const resumo=[
    ["RELATÓRIO DE CRONOANÁLISE"],[],
    ["Estudo",s.nome||""],["Operação",s.operacao||""],["Posto / local",s.posto||""],["Turno",s.turno||""],["Perfil / grupo",s.perfil||""],
    ["Operador",s.operador||""],["Analista",s.analista||""],["Data",s.data||""],[],
    ["PARÂMETROS"],
    ["Unidade de medida",u],["Pessoas na atividade",st.N],
    ["Horas disponíveis por pessoa/dia (PF&D já descontado)",st.horas],["Demanda diária ("+u+")",st.dem>0?st.dem:"não informada"],
    ["Ciclos cronometrados",st.ciclos.length],["Ciclos completos",st.completos],["Ciclos com quantidade informada",st.comQ],[],
    ["PRODUTIVIDADE"],
    ["Quantidade média por ciclo ("+u+")",r(st.qMean)],["Quantidade total observada ("+u+")",r(st.qTot)],
    ["Tempo do ciclo médio (s)",r(st.tpCiclo)],["Tempo padrão por "+u1+" (s)",r(st.tpUn)],
    ["Homem-hora por "+u1+" (h·h)",r(st.hhUn,5)],["Produtividade ("+u+"/h·h)",r(st.prod)],
    ["Capacidade da equipe ("+u+"/h)",r(st.capEq)],["Capacidade da equipe por dia ("+u+")",r(st.capDia,1)],
    ["Pessoas necessárias para a demanda",r(st.pessoasNec)],["Pessoas necessárias (arredondado para cima)",Number.isFinite(st.pessoasNec)?Math.ceil(st.pessoasNec-1e-9):""],[],
    ["CENÁRIOS","Padrão (sem NC)","Real (com NC)","Diferença","Impacto (%)"],
    ...scen(st,u,u1),[],
    ["VALIDADE DA AMOSTRA · tempo por "+u1+" (ciclos completos, com quantidade e sem leitura excluída)"],
    ["Ciclos válidos",st.amostra.n],["Média (s/"+u1+")",r(st.amostra.mean)],["Mediana (s/"+u1+")",r(st.amostra.med)],
    ["Desvio padrão (s/"+u1+")",r(st.amostra.sd)],["CV (%)",r(st.amostra.cv,1)],["Mínimo",r(st.amostra.min)],["Máximo",r(st.amostra.max)],
    ["Ciclos necessários (95% de confiança, ±5%)",Number.isFinite(st.amostra.nNec)?st.amostra.nNec:""],["Situação",situ(st.amostra.n,st.amostra.nNec)],[],
    ["TEMPOS POR ELEMENTO"],
    ["Elemento","Leituras válidas","Excluídas","Com NC","Média (s)","Mediana (s)","Desvio padrão (s)","CV (%)","Mínimo (s)","Máximo (s)","% do ciclo","Por "+u1+" (s)","Leituras necessárias (95%, ±5%)","Situação"],
    ...st.rows.map(x=>[x.e.nome,x.n,x.exc,x.ncN,r(x.mean),r(x.med),r(x.sd),r(x.cv,1),r(x.min),r(x.max),r(x.pctCiclo,1),r(x.porUn),Number.isFinite(x.nNec)?x.nNec:"",situ(x.n,x.nNec)]),
    ["CICLO MÉDIO","","","",r(st.tmCiclo),"","","","","",100,r(st.tpUn)],[],
    ["NÃO CONFORMIDADES"],
    ["Ocorrências",st.nc.n],["Tempo total em NC (s)",r(st.nc.total)],["% do tempo observado",r(st.nc.pctObs,1)],
    ["Ciclos afetados",st.nc.ciclosAfet+" de "+st.ciclos.length],["% de ciclos afetados",r(st.nc.pctCiclos,1)],
    ["Principal causa (tempo)",st.nc.pareto[0]?st.nc.pareto[0].tipo:"—"],[],
    ["Observações gerais",s.obsGeral||""],[],
    ["Tempo padrão = média das leituras válidas. As pausas (PF&D) estão descontadas nas horas disponíveis por pessoa/dia."],
    ["Produtividade = 1 ÷ (tempo padrão por "+u1+" × pessoas ÷ 3600). Por "+u1+" = tempo do ciclo médio ÷ quantidade média por ciclo."],
    ["Amostra: N' = (40·√(nΣx² − (Σx)²) / Σx)², para 95% de confiança e erro de ±5%."],
    ["As não conformidades são cronometradas em paralelo ao elemento em andamento."]
  ];

  const elHead=s.elementos.map(e=>e.nome);
  const ciclosAoa=[["Ciclo",...elHead,"Tempo do ciclo (s)","Quantidade ("+u+")","s por "+u1,"Produtividade bruta ("+u+"/h·h)","Válido para amostra","Nº de NC","Tempo em NC (s)","Observações"]];
  st.ciclos.forEach(x=>{
    const c=x.c;
    const cels=s.elementos.map(e=>{const ls=c.leituras.filter(l=>l.elId===e.id);return ls.length?r(ls.reduce((a,l)=>a+l.t,0)):"";});
    const obs=[];
    if(c.obs)obs.push(c.obs);
    c.leituras.forEach(l=>{if(l.obs)obs.push(elNome(s,l.elId)+": "+l.obs);});
    c.ncs.forEach(n=>obs.push("NC "+(n.tipo||"não classificada")+" ("+r(n.t,1)+" s)"+(n.obs?": "+n.obs:"")));
    ciclosAoa.push([x.n,...cels,r(x.tempo),x.q??"",r(x.sUn),r(x.prodBruta),x.valido?"Sim":"Não"+(!x.completo?" (incompleto)":!x.q?" (sem quantidade)":" (leitura excluída)"),x.ncN,r(x.ncT),obs.join(" | ")]);
  });

  const reg=[["Ciclo","Ordem","Elemento","Tempo (s)","Tempo em NC durante a leitura (s)","Anormal (marcada)","Excluída da média","Observação"]];
  s.ciclos.forEach(c=>c.leituras.forEach((l,i)=>reg.push([c.n,i+1,elNome(s,l.elId),r(l.t),r(l.nc),l.parcial?"Parcial (estudo encerrado)":l.anormal?"Sim":"Não",excl(s,l)?"Sim":"Não",l.obs||""])));

  const nc=[["Ciclo","Elemento em andamento","Tipo","Duração (s)","Observação"]];
  st.nc.lista.forEach(x=>nc.push([x.ciclo,elNome(s,x.elId),x.tipo||"Não classificada",r(x.t),x.obs||""]));
  if(!st.nc.lista.length)nc.push(["Nenhuma não conformidade registrada"]);
  nc.push([],["PARETO POR TIPO"],["Tipo","Ocorrências","Tempo total (s)","Tempo médio (s)","% do tempo em NC","% acumulado","% do tempo observado"]);
  st.nc.pareto.forEach(p=>nc.push([p.tipo,p.n,r(p.t),r(p.media),r(p.pct,1),r(p.acum,1),r(p.pctObs,1)]));
  nc.push([],["POR ELEMENTO"],["Elemento","Ocorrências","Tempo total (s)"]);
  st.nc.porEl.forEach(p=>nc.push([p.nome,p.n,r(p.t)]));

  const obsA=[["Ciclo","Elemento","Origem","Tipo de NC","Tempo (s)","Observação"]];
  if(s.obsGeral)obsA.push(["","","Estudo","","",s.obsGeral]);
  s.ciclos.forEach(c=>{
    if(c.obs)obsA.push([c.n,"","Ciclo","","",c.obs]);
    c.leituras.forEach(l=>{if(l.obs)obsA.push([c.n,elNome(s,l.elId),"Leitura","",r(l.t),l.obs]);});
    c.ncs.forEach(n=>{if(n.obs)obsA.push([c.n,elNome(s,n.elId),"Não conformidade",n.tipo||"Não classificada",r(n.t),n.obs]);});
  });
  if(obsA.length===1)obsA.push(["Nenhuma observação registrada"]);

  return [
    {name:"Resumo",aoa:resumo,cols:[44,16,11,9,11,11,13,9,11,11,10,14,14,16,20]},
    {name:"Ciclos",aoa:ciclosAoa,cols:[7,...elHead.map(()=>14),13,13,11,16,20,9,13,60]},
    {name:"Registros",aoa:reg,cols:[7,7,30,10,16,12,12,50]},
    {name:"Não conformidades",aoa:nc,cols:[30,24,30,12,50,12,16]},
    {name:"Observações",aoa:obsA,cols:[7,28,18,26,10,70]}
  ];
}

return {scen,UNIDADES,NC_PADRAO,NC_ANTIGOS,TURNOS,normalize,unidade,sing,excl,num,describe,stats,sheets};
})();

</script>
<script>
window.CronoReport=(function(){
"use strict";
const C=window.CronoCore;
const COL={ink:"1B2329",band:"1F2D36",bandSub:"C9D3D9",accent:"B86A00",accentSoft:"FBEBD5",muted:"5D6B75",line:"D3DADF",zebra:"F6F8F9",label:"EEF1F3",
  bad:"B23A32",badSoft:"F8E0DE",ok:"2F7D4A",okSoft:"DFF0E4",warn:"A35A00",warnSoft:"FBEBD5",white:"FFFFFF",grey:"8A969E"};
const F="Arial";
const argb=h=>"FF"+h;
const font=(o={})=>Object.assign({name:F,size:10,color:{argb:argb(COL.ink)}},o,o.color?{color:{argb:argb(o.color)}}:{});
const fill=h=>({type:"pattern",pattern:"solid",fgColor:{argb:argb(h)}});
const side=(h=COL.line,style="thin")=>({style,color:{argb:argb(h)}});
const r2=(v,d=2)=>Number.isFinite(v)?Math.round(v*10**d)/10**d:null;
const nf2="#,##0.00",nf1="#,##0.0",nf0="#,##0";

/* ---------------- gráficos (canvas → PNG) ---------------- */
function canvas(w,h){
  if(typeof document==="undefined")return null;
  const c=document.createElement("canvas");const k=2;c.width=w*k;c.height=h*k;const g=c.getContext("2d");g.scale(k,k);
  g.fillStyle="#FFFFFF";g.fillRect(0,0,w,h);g.font="12px Arial";g.textBaseline="middle";return {c,g,w,h};
}
function niceMax(v){if(!(v>0))return 1;const p=10**Math.floor(Math.log10(v));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function fmtN(v,d=0){return v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});}
function wrapLabel(g,txt,maxW){
  const words=String(txt).split(/\s+/);const lines=[];let cur="";
  words.forEach(w=>{const t=cur?cur+" "+w:w;if(g.measureText(t).width<=maxW||!cur)cur=t;else{lines.push(cur);cur=w;}});
  if(cur)lines.push(cur);
  if(lines.length>2){lines.length=2;let l=lines[1];while(g.measureText(l+"…").width>maxW&&l.length>1)l=l.slice(0,-1);lines[1]=l+"…";}
  return lines;
}
function drawPareto(st){
  const P=st.nc.pareto;if(!P.length)return null;
  const K=canvas(620,330);if(!K)return null;const {g,w,h}=K;
  const L=56,R=50,T=30,B=70,pw=w-L-R,ph=h-T-B;
  const ymax=niceMax(P[0].t);
  g.fillStyle="#"+COL.ink;g.font="bold 14px Arial";g.textAlign="left";g.fillText("Pareto das não conformidades (tempo perdido)",L,14);
  g.font="12px Arial";
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g.strokeStyle="#E3E8EB";g.lineWidth=1;g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();
    g.fillStyle="#"+COL.muted;g.textAlign="right";g.fillText(fmtN(ymax*i/4,ymax<10?1:0)+" s",L-6,y);
    g.textAlign="left";g.fillText(fmtN(25*i)+"%",L+pw+6,y);}
  const bw=pw/P.length;
  P.forEach((p,i)=>{const bh=p.t/ymax*ph;const x=L+i*bw+bw*0.18;g.fillStyle="#"+COL.bad;g.fillRect(x,T+ph-bh,bw*0.64,bh);
    g.fillStyle="#"+COL.ink;g.textAlign="center";g.font="bold 12px Arial";g.fillText(fmtN(p.t,1),L+i*bw+bw/2,T+ph-bh-9);
    g.font="12px Arial";g.fillStyle="#"+COL.muted;wrapLabel(g,p.tipo,bw-6).forEach((ln,k)=>g.fillText(ln,L+i*bw+bw/2,T+ph+15+k*14));});
  g.strokeStyle="#"+COL.accent;g.lineWidth=2;g.beginPath();
  P.forEach((p,i)=>{const x=L+i*bw+bw/2,y=T+ph-p.acum/100*ph;i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
  P.forEach((p,i)=>{const x=L+i*bw+bw/2,y=T+ph-p.acum/100*ph;g.fillStyle="#"+COL.accent;g.beginPath();g.arc(x,y,3.5,0,7);g.fill();});
  g.strokeStyle="#"+COL.line;g.beginPath();g.moveTo(L,T+ph);g.lineTo(L+pw,T+ph);g.stroke();
  // legenda
  g.font="12px Arial";g.textAlign="left";const ly=h-12;
  g.fillStyle="#"+COL.bad;g.fillRect(L,ly-5,10,10);g.fillStyle="#"+COL.muted;g.fillText("Tempo total (s)",L+15,ly);
  g.strokeStyle="#"+COL.accent;g.lineWidth=2;g.beginPath();g.moveTo(L+120,ly);g.lineTo(L+140,ly);g.stroke();g.fillText("% acumulado",L+146,ly);
  return K.c.toDataURL("image/png");
}
function drawRun(st,u1){
  const pts=st.ciclos.filter(x=>Number.isFinite(x.sUn));if(pts.length<2)return null;
  const K=canvas(1000,300);if(!K)return null;const {g,w,h}=K;
  const L=60,R=20,T=30,B=46,pw=w-L-R,ph=h-T-B;
  const ys=pts.map(x=>x.sUn);const ymax=niceMax(Math.max(...ys)*1.1);
  const n=st.ciclos.length;const xOf=i=>L+(n>1?(i)/(n-1):0.5)*pw;
  g.fillStyle="#"+COL.ink;g.font="bold 14px Arial";g.textAlign="left";g.fillText("Tempo por "+u1+" em cada ciclo (s)",L,14);
  g.font="12px Arial";
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g.strokeStyle="#E3E8EB";g.lineWidth=1;g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();
    g.fillStyle="#"+COL.muted;g.textAlign="right";g.fillText(fmtN(ymax*i/4,ymax<10?1:0),L-6,y);}
  const yOf=v=>T+ph-v/ymax*ph;
  const step=Math.max(1,Math.ceil(n/25));
  st.ciclos.forEach((x,i)=>{if(i%step===0||i===n-1){g.fillStyle="#"+COL.muted;g.textAlign="center";g.fillText(String(x.n),xOf(i),T+ph+14);}});
  g.textAlign="center";g.fillText("Ciclo",L+pw/2,T+ph+32);
  const mean=st.amostra.mean;
  if(Number.isFinite(mean)){g.setLineDash([6,4]);g.strokeStyle="#"+COL.accent;g.lineWidth=1.5;g.beginPath();g.moveTo(L,yOf(mean));g.lineTo(L+pw,yOf(mean));g.stroke();g.setLineDash([]);
    g.fillStyle="#"+COL.accent;g.textAlign="right";g.font="bold 12px Arial";g.fillText("média válida "+fmtN(mean,2),L+pw,yOf(mean)-9);g.font="12px Arial";}

/* ---------------- helpers de planilha ---------------- */
function mk(ws){
  const cell=(r,c)=>ws.getCell(r,c);
  function range(r1,c1,r2,c2,fn){for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)fn(cell(r,c),r,c);}
  function put(r,c,v,st={},r2_,c2_){
    if(r2_!=null&&(r2_!==r||c2_!==c)){ws.mergeCells(r,c,r2_,c2_);}
    const x=cell(r,c);x.value=v;
    if(st.font)x.font=font(st.font);else x.font=font();
    if(st.fill)range(r,c,r2_??r,c2_??c,y=>y.fill=fill(st.fill));
    if(st.numFmt)x.numFmt=st.numFmt;
    x.alignment=Object.assign({vertical:"middle"},st.align||{});
    if(st.border)range(r,c,r2_??r,c2_??c,y=>y.border=st.border);
    return x;
  }
  return {cell,range,put};
}

}

/* tabela genérica */
function table(ws,r0,c0,cols,rows,opt={}){
  const {put,cell}=mk(ws);
  const pos=[];let cc=c0;cols.forEach(h=>{pos.push(cc);cc+=h.span||1;});
  cols.forEach((h,i)=>put(r0,pos[i],h.t,{font:{bold:true,size:9,color:COL.white},fill:COL.band,align:{horizontal:h.al||(i?"center":"left"),wrapText:true},border:bdr},r0,pos[i]+(h.span||1)-1));
  ws.getRow(r0).height=opt.headH||30;
  rows.forEach((row,k)=>{
    const r=r0+1+k;const z=opt.rowFill?opt.rowFill(k,row):(k%2?COL.zebra:null);
    row.v.forEach((v,i)=>{
      const col=cols[i];
      const x=put(r,pos[i],v==null||Number.isNaN(v)?"":v,{font:Object.assign({size:9.5},row.font||{},(row.cellFont&&row.cellFont[i])||{}),
        fill:(row.cellFill&&row.cellFill[i])||z||undefined,numFmt:col.nf,align:{horizontal:col.al||(typeof v==="number"?"right":"left"),indent:(col.al||(typeof v==="number"?"right":"left"))==="left"?1:0,wrapText:!!col.wrap,vertical:col.wrap?"top":"middle"},border:bdr},r,pos[i]+(col.span||1)-1);
      return x;

}
const estH=(txt,widthChars,base=15)=>{const t=String(txt||"");if(!t)return null;const lines=t.split("\n").reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/(widthChars*1.05))),0);return Math.max(base,lines*12.5+4);};

  const ws=wb.getWorksheet(EMBED);if(!ws||ws.getCell(1,1).value!=="CRONO1")return null;
  let t="";for(let k=2;k<=ws.rowCount;k++){const v=ws.getCell(k,1).value;if(v==null)break;t+=typeof v==="string"?v:(v.richText?v.richText.map(x=>x.text).join(""):String(v));}

}
/* ---------------- aba Dados + tabela dinâmica ---------------- */
const SIT_ORDER=["Válida","Com NC","Anormal","Parcial"];
function dadosTable(s){
  const dataBR=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?`${m[3]}/${m[2]}/${m[1]}`:(d||"");};
  const head=["Estudo","Data","Operação","Turno","Perfil / grupo","Operador","Ciclo","Ordem","Elemento","Tempo (s)","Quantidade do ciclo","NC na leitura (s)","Tipo de NC","Situação","No cenário padrão","No cenário real","Observação"];
  const rows=[];
  // Uma linha por elemento em cada ciclo (marcações repetidas do mesmo elemento são somadas), como nos cálculos do app.
  s.ciclos.forEach(c=>{
    const seen=[];c.leituras.forEach(l=>{if(!seen.includes(l.elId))seen.push(l.elId);});
    seen.forEach((elId,i)=>{
      const ls=c.leituras.filter(l=>l.elId===elId);
      const t=ls.reduce((a,l)=>a+l.t,0),nc=ls.reduce((a,l)=>a+l.nc,0);
      const parcial=ls.some(l=>l.parcial),anormal=ls.some(l=>l.anormal);
      const sit=parcial?"Parcial":anormal?"Anormal":nc>0?"Com NC":"Válida";
      const tipos=[...new Set(c.ncs.filter(x=>x.elId===elId).map(x=>x.tipo||"Não classificada"))].join(", ");
      const q=C.num(c.qtd);
      rows.push([s.nome||"",dataBR(s.data),s.operacao||"",s.turno||"",s.perfil||"",s.operador||"",c.n,i+1,nomeEl(s,elId),r2(t),q>0?q:null,nc>0?r2(nc,1):null,nc>0?tipos:"",sit,ls.some(l=>C.excl(s,l))?"Não":"Sim",(anormal||parcial)?"Não":"Sim",ls.map(l=>l.obs).filter(Boolean).join("; ")]);
    });
  });
  return {head,rows,numCols:new Set([6,7,9,10,11]),rowField:8,colField:13,dataField:9};
}

async function pivotFromTable(buf,D,JSZip,cfg={}){

      const v=D.rows.map(r=>r[f]).filter(x=>typeof x==="number");const blank=v.length<nR;

      const attrs=v.length?`containsSemiMixedTypes="0" containsString="0" containsNumber="1"${ints?' containsInteger="1"':""} minValue="${Math.min(...v)}" maxValue="${Math.max(...v)}"${blank?' containsBlank="1"':""}`:`containsBlank="1"`;
      if(blank&&v.length)return `<cacheField name="${xesc(h)}" numFmtId="0"><sharedItems containsString="0" containsBlank="1" containsNumber="1"${ints?' containsInteger="1"':""} minValue="${Math.min(...v)}" maxValue="${Math.max(...v)}"/></cacheField>`;

  const recs=D.rows.map(r=>"<r>"+r.map((v,f)=>{
    if(D.numCols.has(f))return typeof v==="number"?`<n v="${v}"/>`:"<m/>";
    const it=items[f];if(v===""||v==null)return `<x v="${it.vals.length}"/>`;return `<x v="${it.vals.indexOf(v)}"/>`;
  }).join("")+"</r>").join("");
  const cacheRec=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<pivotCacheRecords xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" count="${nR}">${recs}</pivotCacheRecords>`;
  const rowIt=items[D.rowField],colIt=items[D.colField];

  const axisItems=n=>`<items count="${n+1}">${Array.from({length:n},(_,i)=>`<item x="${i}"/>`).join("")}<item t="default"/></items>`;
  const pf=D.head.map((h,f)=>f===D.rowField?`<pivotField axis="axisRow" showAll="0">${axisItems(nRow)}</pivotField>`
    :f===D.colField?`<pivotField axis="axisCol" showAll="0">${axisItems(nCol)}</pivotField>`
    :f===D.dataField?`<pivotField dataField="1" showAll="0"/>`
    :f===pageField?`<pivotField axis="axisPage" showAll="0">${axisItems(items[f].vals.length+(items[f].blank?1:0))}</pivotField>`:`<pivotField showAll="0"/>`).join("");
  const lineItems=n=>Array.from({length:n},(_,i)=>i?`<i><x v="${i}"/></i>`:`<i><x/></i>`).join("")+`<i t="grand"><x/></i>`;
  const top=pageField!=null?6:4,lastCol=colLetter(1+nCol+1),lastRow=top+1+nRow+1;
  const pivotXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<pivotTableDefinition xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" name="DinamicaTempos" cacheId="1" applyNumberFormats="0" applyBorderFormats="0" applyFontFormats="0" applyPatternFormats="0" applyAlignmentFormats="0" applyWidthHeightFormats="1" dataCaption="Valores" grandTotalCaption="Total geral" updatedVersion="6" minRefreshableVersion="3" useAutoFormatting="1" itemPrintTitles="1" createdVersion="6" indent="0" outline="1" outlineData="1" multipleFieldFilters="0"${pageField!=null?' rowPageCount="1" colPageCount="1"':""} rowHeaderCaption="${xesc(cfg.rowCaption||"Elemento")}" colHeaderCaption="${xesc(cfg.colCaption||"Situação")}"><location ref="A${top}:${lastCol}${lastRow}" firstHeaderRow="1" firstDataRow="2" firstDataCol="1"/><pivotFields count="${nF}">${pf}</pivotFields><rowFields count="1"><field x="${D.rowField}"/></rowFields><rowItems count="${nRow+1}">${lineItems(nRow)}</rowItems><colFields count="1"><field x="${D.colField}"/></colFields><colItems count="${nCol+1}">${lineItems(nCol)}</colItems>${pageField!=null?`<pageFields count="1"><pageField fld="${pageField}" item="${Math.max(0,items[pageField].vals.indexOf(cfg.pageItem))}" hier="-1"/></pageFields>`:""}<dataFields count="1"><dataField name="${xesc(cfg.dataName||"Tempo médio (s)")}" fld="${D.dataField}" subtotal="average" baseField="0" baseItem="0" numFmtId="2"/></dataFields><pivotTableStyleInfo name="PivotStyleMedium2" showRowHeaders="1" showColHeaders="1" showRowStripes="0" showColStripes="0" showLastColumn="1"/></pivotTableDefinition>`;
  zip.file("xl/pivotCache/pivotCacheDefinition1.xml",cacheDef);
  zip.file("xl/pivotCache/pivotCacheRecords1.xml",cacheRec);
  zip.file("xl/pivotCache/_rels/pivotCacheDefinition1.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/pivotCacheRecords" Target="pivotCacheRecords1.xml"/></Relationships>`);
  zip.file("xl/pivotTables/pivotTable1.xml",pivotXml);
  zip.file("xl/pivotTables/_rels/pivotTable1.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/pivotCacheDefinition" Target="../pivotCache/pivotCacheDefinition1.xml"/></Relationships>`);
  // planilha da dinâmica → tabela
  const sName=pivSheet.split("/").pop(),relPath="xl/worksheets/_rels/"+sName+".rels";
  const pivRel=`<Relationship Id="rIdPivot1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/pivotTable" Target="../pivotTables/pivotTable1.xml"/>`;
  const existing=zip.file(relPath)?await zip.file(relPath).async("string"):null;
  zip.file(relPath,existing?existing.replace("</Relationships>",pivRel+"</Relationships>"):`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${pivRel}</Relationships>`);
  // workbook → cache
  zip.file("xl/_rels/workbook.xml.rels",wbRels.replace("</Relationships>",`<Relationship Id="rIdPivotCache1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/pivotCacheDefinition" Target="pivotCache/pivotCacheDefinition1.xml"/></Relationships>`));
  const pc=`<pivotCaches><pivotCache cacheId="1" r:id="rIdPivotCache1"/></pivotCaches>`;
  let w2=wbXml;
  if(/<calcPr[^>]*\/>/.test(w2))w2=w2.replace(/(<calcPr[^>]*\/>)/,"$1"+pc);

<script>
window.CronoConsol=(function(){
const GRUPOS=[["estudo","Estudo",0],["turno","Turno",3],["perfil","Perfil / grupo",4],["data","Data",1],["operador","Operador",5]];
const dataBR=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?`${m[3]}/${m[2]}/${m[1]}`:(d||"");};
function labelOf(s,g){
  const v=g==="estudo"?s.nome:g==="data"?dataBR(s.data):s[g];
  return String(v||"").trim()||({turno:"(sem turno)",perfil:"(sem perfil)",operador:"(sem operador)",data:"(sem data)",estudo:"(sem nome)"})[g];
}
// Junta vários estudos num só: elementos casados pelo nome, ciclos em sequência.
function merge(list,nome){
  const C=window.CronoCore;
  const base=JSON.parse(JSON.stringify(list[0]));
  const m=Object.assign(base,{id:"g_"+nome,nome,ciclos:[],elementos:[]});
  const byName={};
  list.forEach(s=>s.elementos.forEach(e=>{const k=e.nome.trim();if(!byName[k]){byName[k]={id:"g"+m.elementos.length,nome:k};m.elementos.push(byName[k]);}}));
  list.forEach(s=>{const map={};s.elementos.forEach(e=>map[e.id]=byName[e.nome.trim()].id);
    s.ciclos.forEach(c=>m.ciclos.push(Object.assign({},c,{n:m.ciclos.length+1,
      leituras:c.leituras.map(l=>Object.assign({},l,{elId:map[l.elId]||l.elId})),
      ncs:c.ncs.map(x=>Object.assign({},x,{elId:map[x.elId]||x.elId}))})));});
  return C.normalize(m);
}
function groups(studies,g){
  const out=[];studies.forEach(s=>{const lab=labelOf(s,g);let x=out.find(y=>y.lab===lab);if(!x){x={lab,list:[]};out.push(x);}x.list.push(s);});
  if(g==="data"||g==="estudo")out.sort((a,b)=>String(a.list[0].data||"").localeCompare(String(b.list[0].data||""))||a.lab.localeCompare(b.lab,"pt-BR",{numeric:true}));
  else out.sort((a,b)=>a.lab.localeCompare(b.lab,"pt-BR",{numeric:true}));
  return out;
}
// Avisos antes de consolidar
function check(studies){
  const C=window.CronoCore,w=[];
  const us=[...new Set(studies.map(s=>C.unidade(s)))];if(us.length>1)w.push("Unidades diferentes ("+us.join(", ")+"): os tempos por unidade não são comparáveis.");

  const par=[...new Set(studies.map(s=>[s.pessoas,s.horasDia].join("/")))];if(par.length>1)w.push("Pessoas ou horas por dia diferentes: o consolidado usa os do primeiro estudo de cada grupo.");
  return w;
}
async function build(studies,ExcelJS,JSZip,opts={}){

    {v:["Ciclos (válidos / total)",...S.map(x=>`${x.st.amostra.n} / ${x.st.ciclos.length}`),...(two?[""]:[])]},

    numRow(`Produtividade real (${u}/h·h)`,x=>x.st.cenarios.real.prod,nf1),
    numRow(`Capacidade/dia padrão (${u})`,x=>x.st.cenarios.padrao.capDia,nf0),
    numRow(`Capacidade/dia real (${u})`,x=>x.st.cenarios.real.capDia,nf0),
    numRow("Impacto das NC na produtividade",x=>x.st.cenarios.gap.prodPct/100,"+0.0%;-0.0%;0.0%",{pct:true,goodUp:true}),

      if(store&&store.kind==="db"){await store.col.doc(s.id).set(JSON.parse(JSON.stringify(s)));setSave("Salvo");}
      else{const all=lsAll();all[s.id]=s;setSave(lsSet(all)?"Salvo":"Sem espaço para salvar");}
    }catch(e){setSave(e&&e.code==="quota_exceeded"?"Espaço cheio":"Falha ao salvar");}
  });
  return writing;
}
function saveCfg(){
  writing=writing.then(async()=>{
    try{if(store&&store.kind==="db")await store.col.doc("config").set({tiposNC:cfg.tiposNC.slice()});
      else localStorage.setItem(LSC,JSON.stringify(cfg));}catch(e){}
  });
}
async function removeStudy(id){
  delete studies[id];consolSel.delete(id);
  try{if(store&&store.kind==="db")await store.col.doc(id).delete();else{const all=lsAll();delete all[id];lsSet(all);}}catch(e){}
}
let saveTxt="";
function setSave(t){saveTxt=t;const el=$("#saveState");if(el)el.textContent=t;}
function mergeCfg(saved){
  if(saved&&Array.isArray(saved.tiposNC)&&saved.tiposNC.length){cfg.tiposNC=saved.tiposNC.slice();return false;}
  const set=C.NC_PADRAO.slice();
  Object.values(studies).forEach(s=>s.ciclos.forEach(c=>c.ncs.forEach(n=>{if(n.tipo&&!set.includes(n.tipo))set.push(n.tipo);})));
  cfg.tiposNC=set;return true;
}
async function initStore(){
  let db=null,user=null,id=null,saved=null;
  if(!PWA){try{[db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);}catch(e){}}
  if(db&&user){try{id=await user.id();}catch(e){}}
  if(db&&id){
    const col=db.collection("data/users/"+id);
    store={kind:"db",col};
    try{
      const snap=await col.get();
      snap.docs.forEach(d=>{const v=d.data();if(d.id==="config"){saved=v;return;}if(v&&v.id)studies[v.id]=C.normalize(JSON.parse(JSON.stringify(v)));});
      const local=lsAll();
      for(const k in local){if(!studies[k]){studies[k]=C.normalize(local[k]);persist(studies[k]);}}
      setSave("Salvo na sua conta");
    }catch(e){store={kind:"ls"};saved=loadLocal();}
  }else{store={kind:"ls"};saved=loadLocal();}
  if(mergeCfg(saved))saveCfg();
  restoreTimer();
  ready=true;
  render();
  if(PWA)try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
function loadLocal(){const all=lsAll();for(const k in all)studies[k]=C.normalize(all[k]);setSave("Salvo neste aparelho");try{return JSON.parse(localStorage.getItem(LSC)||"null");}catch(e){return null;}}
const sortedIds=()=>Object.keys(studies).sort((a,b)=>(studies[b].atualizado||0)-(studies[a].atualizado||0));

/* cronômetro sobrevive ao app fechar ou recarregar */
let ready=false;
function saveTimer(){
  if(!ready)return;
  try{
    const s=cur();
    if(!s||!timer.cycle){localStorage.removeItem(LST);return;}
    const ci=s.ciclos.indexOf(timer.cycle);if(ci<0){localStorage.removeItem(LST);return;}
    const nc=timer.nc?{s:timer.nc.s,elId:timer.nc.elId,tipo:timer.nc.tipo,obs:timer.nc.obs,ci:s.ciclos.indexOf(timer.nc.cycle)}:null;
    localStorage.setItem(LST,JSON.stringify({sid:s.id,ci,running:timer.running,runStart:timer.runStart,actAcc:timer.actAcc,lapStart:timer.lapStart,cycleStart:timer.cycleStart,elIdx:timer.elIdx,ncLog:timer.ncLog,nc,obs:drafts.obs}));
  }catch(e){}
}
function restoreTimer(){
  let t=null;try{t=JSON.parse(localStorage.getItem(LST)||"null");}catch(e){}
  if(!t)return;
  const s=studies[t.sid];const c=s&&s.ciclos[t.ci];
  if(!c){try{localStorage.removeItem(LST);}catch(e){}return;}
  Object.assign(timer,{running:t.running,runStart:t.runStart,actAcc:t.actAcc,lapStart:t.lapStart,cycleStart:t.cycleStart,elIdx:Math.min(t.elIdx,s.elementos.length-1),cycle:c,ncLog:t.ncLog||[],undo:[],lastClosed:null,
    nc:t.nc?{s:t.nc.s,elId:t.nc.elId,tipo:t.nc.tipo,obs:t.nc.obs,cycle:s.ciclos[t.nc.ci]||c}:null});
  drafts.obs=t.obs||"";
  curId=s.id;view="study";tab="crono";
  try{history.replaceState({v:"home"},"");history.pushState({v:"study"},"");}catch(e){}
  if(timer.running)lockOn();
  setTimeout(()=>toast(`Ciclo ${c.n} em andamento recuperado`),300);
}

/* ---------- navegação ---------- */
function openStudy(id,t){
  if(timer.cycle&&id!==curId){toast("Encerre o ciclo em andamento antes");return;}
  if(id!==curId)resetTimer();
  curId=id;view="study";confirmDel=false;showAll=false;
  const s=cur();tab=t||(s&&s.ciclos.length?"result":"estudo");
  try{history.pushState({v:"study"},"");}catch(e){}
  render();window.scrollTo(0,0);
}
function goHome(){
  if(timer.cycle){toast("Encerre o ciclo em andamento antes de sair");return false;}
  view="home";confirmDel=false;render();window.scrollTo(0,0);return true;
}
window.addEventListener("popstate",()=>{
  if(view==="study"){if(!goHome()){try{history.pushState({v:"study"},"");}catch(e){}}}
});

/* ---------- render ---------- */
function render(){
  const s=cur();
  if(view==="study"&&!s)view="home";

  const app=$("#app");
  document.body.dataset.view=view==="home"?homeTab:tab;

    const t={estudos:"Estudos",consolidar:"Consolidar",ajustes:"Ajustes"}[homeTab];

    if(tab==="estudo")renderEstudo(s);else if(tab==="crono")renderCrono(s);else renderResult(s);

}
function renderBar(){

function renderTabbar(){

const elName=(s,id)=>(s.elementos.find(e=>e.id===id)||{nome:"(elemento removido)"}).nome;
const cycComplete=(s,c)=>s.elementos.every(e=>c.leituras.some(l=>l.elId===e.id&&!l.parcial));
function lastQty(s){for(let i=s.ciclos.length-1;i>=0;i--){if(s.ciclos[i].qtd!=null)return s.ciclos[i].qtd;}return null;}

function renderCrono(s){
  const u=C.unidade(s),porCiclo=s.unidade==="ciclos";
  const list=showAll?s.ciclos.slice().reverse():s.ciclos.slice(-3).reverse();
  const inCycle=!!timer.cycle;
  const records=`<div class="records">
    <div class="row between"><h2>Registros</h2>
      ${s.ciclos.length>3?`<button class="btn plain" data-act="showall">${showAll?"Só os últimos":"Ver todos ("+s.ciclos.length+")"}</button>`:""}</div>
    ${list.length?list.map(c=>cycleCard(s,c)).join(""):`<p class="hint">Nenhum ciclo ainda. ${porCiclo?"":"Informe a quantidade e "}toque em Iniciar ciclo quando o operador começar.</p>`}
  </div>`;

  if(!inCycle){
    const nextN=s.ciclos.length+1,lq=lastQty(s),lc=timer.lastClosed&&s.ciclos.includes(timer.lastClosed)?timer.lastClosed:null;
    const lcT=lc?lc.leituras.reduce((a,l)=>a+l.t,0):0;
    $("#panel").innerHTML=`
    ${lc?`<div class="done-strip" role="status"><b>Ciclo ${lc.n} fechado</b> · <span class="num">${fmt(lcT,1)} s</span>${lc.qtd!=null&&!porCiclo?` · ${fmtQ(lc.qtd)} ${esc(u)}`:""}${lc.ncs.length?` · ${lc.ncs.length} NC`:""}
      ${timer.undo.length?`<button class="btn" data-act="undo" style="margin-left:auto">↶ Desfazer</button>`:""}</div>`:""}
    <div class="box start">
      <span class="label">Próximo · ciclo ${nextN}</span>
      ${porCiclo?"":`<label class="field"><span>Quantidade deste ciclo (<b>${esc(u)}</b>)</span>
        <div class="row"><input id="qtyIn" type="text" inputmode="decimal" value="${esc(drafts.qty)}" placeholder="${lq!=null?esc(fmtQ(lq)):"0"}" autocomplete="off">
        ${lq!=null?`<button class="btn" data-act="qtyrep">Repetir ${esc(fmtQ(lq))}</button>`:""}</div></label>`}
      <button class="mark" data-act="startcycle">INICIAR CICLO ${nextN}<small>${s.elementos.length} ${s.elementos.length===1?"elemento":"elementos"} · começa por “${esc(s.elementos[0].nome)}”</small></button>
      ${s.ciclos.length?`<p class="hint">O intervalo entre ciclos não é cronometrado.</p>`:""}
    </div>
    ${records}`;
    return;
  }

  const el=s.elementos[timer.elIdx]||s.elementos[0];
  const isLast=timer.elIdx>=s.elementos.length-1;
  const nc=timer.nc,c=timer.cycle;
  const done=c.leituras.filter(l=>!l.parcial).length;
  let controls;
  if(confirmEnd){
    controls=`<div class="endbox" role="alertdialog" aria-label="Encerrar cronometragem">
      <b>Ciclo ${c.n} está em andamento</b>
      <span class="hint">${done} de ${s.elementos.length} elementos marcados${c.qtd!=null&&!porCiclo?` · ${fmtQ(c.qtd)} ${esc(u)}`:""}. O que fazer com ele?</span>
      ${isLast?`<button class="btn primary" data-act="endclose">Fechar o ciclo agora e encerrar<br><span class="sm">“${esc(el.nome)}” é gravado com ${fmt((act()-timer.lapStart)/1000,1)} s</span></button>`:""}
      <button class="btn" data-act="endpartial">Salvar como incompleto<br><span class="sm">fica no relatório, fora da média e da produtividade</span></button>
      <button class="btn danger" data-act="enddiscard">Descartar o ciclo ${c.n}</button>
      <button class="btn" data-act="endback">Voltar a cronometrar</button>
    </div>`;
  }else{
    controls=`<div class="ctrl">
      <button class="mark ${isLast?"last":""}" id="markBtn" ${timer.running?"":"disabled"}>${isLast?"FECHAR CICLO":"MARCAR"}<small>${isLast?`registra “${esc(el.nome)}” e encerra o ciclo ${c.n}`:`registra “${esc(el.nome)}” e inicia o próximo`}</small></button>
      ${nc?ncPanel(s,nc):`<button class="btn nc full" data-act="ncstart" ${timer.running?"":"disabled"}>⚠ NÃO CONFORMIDADE</button>`}
      <div class="trio full">
        <button class="btn" data-act="undo" ${timer.undo.length?"":"disabled"}>↶ Desfazer</button>
        ${timer.running?`<button class="btn" data-act="pause">Pausar</button>`:`<button class="btn primary" data-act="resume">Retomar</button>`}
        <button class="btn" data-act="stop">Encerrar</button>
      </div>
    </div>`;
  }
  $("#panel").innerHTML=`
  <div class="box clock">
    <div class="label">Ciclo ${c.n}${c.qtd!=null&&!porCiclo?` · ${fmtQ(c.qtd)} ${esc(u)}`:""} · elemento ${timer.elIdx+1} de ${s.elementos.length}${timer.running?"":" · em pausa"}</div>
    <div class="cur">${esc(el.nome)}</div>
    <div class="big" id="lapClock">${fmtClock(act()-timer.lapStart)}</div>
    <div class="sub"><span>Ciclo <b class="num" id="cycClock">${fmtClock(act()-timer.cycleStart)}</b></span><span>Fechados <b class="num">${s.ciclos.filter(x=>x!==c).length}</b></span></div>
    <div class="chips" aria-label="Escolher elemento">
      ${s.elementos.map((e,i)=>`<button class="chip" data-jump="${i}" aria-pressed="${i===timer.elIdx}">${i+1}. ${esc(e.nome)}</button>`).join("")}
    </div>
  </div>
  ${controls}
  <div class="box">
    <label class="field"><span class="label">Observação do elemento em andamento</span>
      <input id="obsIn" value="${esc(drafts.obs)}" placeholder="Ex.: material faltando, ferramenta trocada…" autocomplete="off"></label>
    <div class="row between" style="margin-top:8px">
      <span class="hint">Gravada em “${esc(el.nome)}” ao tocar em ${isLast?"FECHAR CICLO":"MARCAR"}.</span>
      <button class="btn plain" data-act="obslast">Anotar no último registro</button>
    </div>
  </div>
  ${records}`;
}
function ncPanel(s,nc){
  return `<div class="ncbox" role="status">
    <div class="head"><span class="label" style="color:var(--bad)">Não conformidade em andamento</span><span class="ncclock" id="ncClock">${fmtClock(act()-nc.s)}</span></div>
    <div class="hint">Começou em “${esc(elName(s,nc.elId))}”. O elemento continua contando.</div>
    <div class="chips start-j" aria-label="Tipo da não conformidade">${cfg.tiposNC.map(t=>`<button class="chip" data-nctipo="${esc(t)}" aria-pressed="${nc.tipo===t}">${esc(t)}</button>`).join("")}
      <button class="chip add" data-act="ncadd" aria-expanded="${ncAdding}">+ Novo tipo</button></div>
    ${ncAdding?`<div class="row"><input id="ncNewType" placeholder="Nome do novo tipo" autocomplete="off"><button class="btn" data-act="ncaddsave">Adicionar</button></div>`:""}

    <button class="btn ncstop" data-act="ncend">ENCERRAR NÃO CONFORMIDADE</button>
  </div>`;
}
function cycleCard(s,c){
  const ci=s.ciclos.indexOf(c),u=C.unidade(s);
  const tempo=c.leituras.reduce((a,l)=>a+l.t,0);
  const incompleto=c!==timer.cycle&&!cycComplete(s,c);
  const tipos=x=>cfg.tiposNC.concat(x.tipo&&!cfg.tiposNC.includes(x.tipo)?[x.tipo]:[]);
  const rows=c.leituras.map((l,li)=>`<div class="read ${C.excl(s,l)?"abn":""}">
      <span class="t">${fmt(l.t)} s</span>
      <div class="who"><b>${esc(elName(s,l.elId))}</b>${l.nc>0?`<span class="badge">NC ${fmt(l.nc,1)} s</span>`:""}${l.parcial?`<span class="badge warnb">parcial</span>`:""}${l.obs?`<div class="obs">${esc(l.obs)}</div>`:""}</div>
      <div class="acts"><button data-abn="${ci}:${li}" aria-pressed="${l.anormal}" title="Tirar da média">anormal</button><button data-delr="${ci}:${li}" aria-label="Excluir leitura">×</button></div>
    </div>`).join("");
  const ncs=c.ncs.map((x,ni)=>`<div class="read ncr">
      <span class="t">${fmt(x.t)} s</span>

        <div><select id="nct_${ci}_${ni}" data-nctype="${ci}:${ni}" aria-label="Tipo da não conformidade">
          <option value="" ${!x.tipo?"selected":""}>Não classificada</option>
          ${tipos(x).map(t=>`<option ${t===x.tipo?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
        ${x.obs?`<div class="obs">${esc(x.obs)}</div>`:""}</div>
      <div class="acts"><button data-delnc="${ci}:${ni}" aria-label="Excluir não conformidade">×</button></div>
    </div>`).join("");
  return `<div class="cyc">
    <div class="cyc-h"><b>Ciclo ${c.n}${c===timer.cycle?" · em andamento":""}${incompleto?` <span class="badge warnb">incompleto</span>`:""}</b>
      <span class="hint num">${fmt(tempo)} s${c.ncs.length?` · ${c.ncs.length} NC`:""}</span>
      ${s.unidade==="ciclos"?"":`<label class="q"><input id="q_${ci}" data-qty="${ci}" type="text" inputmode="decimal" value="${esc(fmtQ(c.qtd))}" placeholder="qtd" aria-label="Quantidade de ${esc(u)} do ciclo ${c.n}"><span class="hint">${esc(u)}</span></label>`}
    </div>${rows}${ncs}</div>`;
}

    <div class="kpi ${st.nc.n?"alert":""}"><div class="label">Perda em NC</div><div class="v">${fmt(st.nc.pctObs,1)}%</div><div class="u">${st.nc.n} ${st.nc.n===1?"ocorrência":"ocorrências"} · ${fmt(st.nc.total,0)} s</div></div>

  <div class="export">

      <td class="num">${fmt(r.min)}</td><td class="num">${fmt(r.max)}</td><td class="num">${fmt(r.pctCiclo,1)}</td><td class="num">${fmt(r.porUn)}</td><td>${ok(r.n,r.nNec)}</td></tr>`).join("")}</tbody>

        <div class="track"><div class="fill" style="width:${Math.max(2,p.t/maxP*100)}%"></div></div></div>`).join("")}</div>
      <p class="hint" style="margin-top:10px">${st.nc.ciclosAfet} de ${st.ciclos.length} ciclos afetados (${fmt(st.nc.pctCiclos,0)}%).</p>`
      :`<p class="hint">Nenhuma não conformidade registrada. Durante a cronometragem, use o botão vermelho para medir cada ocorrência.</p>`}

function cenBox(st,u,u1){
  const P=st.cenarios.padrao,R=st.cenarios.real;
  const imp=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&a?((b/a-1)*100):NaN;
  const pct=v=>Number.isFinite(v)?`<span class="${Math.abs(v)<0.05?"hint":"neg"}">${v>0?"+":""}${fmt(v,1)}%</span>`:"–";
  const line=(l,a,b,d)=>`<tr><td>${l}</td><td class="num">${fmt(a,d)}</td><td class="num">${fmt(b,d)}</td><td class="num">${pct(imp(a,b))}</td></tr>`;
  return `<div class="box"><h2>Cenários: padrão × real</h2>
    <p class="hint" style="margin-bottom:10px"><b>Padrão</b> tira da média as leituras com não conformidade: é a capacidade do processo. <b>Real</b> mantém essas leituras: é o que a operação entrega hoje.</p>
    <div class="tbl-wrap"><table class="cen">
      <thead><tr><th>Indicador</th><th class="num">Padrão</th><th class="num">Real</th><th class="num">Impacto</th></tr></thead>
      <tbody>${line("Tempo por "+esc(u1)+" (s)",P.un,R.un,2)}${line("Produtividade ("+esc(u)+"/h·h)",P.prod,R.prod,1)}${line("Capacidade/dia ("+esc(u)+")",P.capDia,R.capDia,0)}
      ${st.dem>0?line("Pessoas p/ demanda",P.pessoasNec,R.pessoasNec,2):""}</tbody></table></div>
    ${Number.isFinite(st.cenarios.gap.prodPct)&&st.nc.n?`<p class="hint" style="margin-top:10px">As não conformidades custam <b>${fmt(Math.abs(st.cenarios.gap.prodPct),1)}%</b> da produtividade, ou <b>${fmt(Math.abs(st.cenarios.gap.capDia),0)} ${esc(u)}</b> por dia da equipe${st.dem>0&&Number.isFinite(st.cenarios.gap.pessoas)?` (${fmt(st.cenarios.gap.pessoas,2)} pessoa a mais para a mesma demanda)`:""}.</p>`:""}
  </div>`;
}

/* ---------- cronômetro ---------- */
const now_=()=>Date.now();
const act=()=>timer.actAcc+(timer.running?now_()-timer.runStart:0);
let raf=0;
function tick(){
  cancelAnimationFrame(raf);
  if(!timer.running)return;
  const now=act();
  const a=$("#lapClock"),b=$("#cycClock"),n=$("#ncClock");
  if(a)a.textContent=fmtClock(now-timer.lapStart);
  if(b)b.textContent=fmtClock(now-timer.cycleStart);
  if(n&&timer.nc)n.textContent=fmtClock(now-timer.nc.s);
  raf=requestAnimationFrame(tick);
}
async function lockOn(){try{if(!wakeLock)wakeLock=await navigator.wakeLock?.request("screen");if(wakeLock)wakeLock.addEventListener("release",()=>{wakeLock=null;});}catch(e){wakeLock=null;}}
function lockOff(){try{wakeLock?.release();}catch(e){}wakeLock=null;}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function run(){if(!timer.running){timer.runStart=now_();timer.running=true;}lockOn();}
function halt(){if(timer.running){timer.actAcc=act();timer.running=false;}cancelAnimationFrame(raf);}
function ncOverlap(a,b){
  let ms=0;
  timer.ncLog.concat(timer.nc?[{s:timer.nc.s,e:b}]:[]).forEach(x=>{ms+=Math.max(0,Math.min(x.e,b)-Math.max(x.s,a));});
  return ms;
}
const parseQty=v=>{const t=String(v??"").trim();if(!t)return null;const n=parseFloat(t.replace(",","."));return Number.isFinite(n)&&n>=0?n:undefined;};

function startCycle(){
  const s=cur();if(!s||timer.cycle)return;
  let q;
  if(s.unidade==="ciclos")q=1;
  else{const qi=$("#qtyIn");q=parseQty(qi?qi.value:drafts.qty);if(q===undefined){toast("Quantidade inválida");return;}}
  timer.cycle={n:s.ciclos.length+1,leituras:[],ncs:[],qtd:q,obs:""};
  s.ciclos.push(timer.cycle);
  run();
  timer.lapStart=act();timer.cycleStart=timer.lapStart;timer.elIdx=0;timer.ncLog=[];timer.undo=[];timer.lastClosed=null;
  drafts.qty="";confirmEnd=null;
  buzz(30);scheduleSave(s);render();
  if(q==null)toast("Ciclo iniciado sem quantidade. Você pode informar depois no registro.");
}
function record(parcial){
  const s=cur(),c=timer.cycle;const now=act();
  const obsEl=$("#obsIn");const obs=((obsEl?obsEl.value:drafts.obs)||"").trim();
  const el=s.elementos[timer.elIdx];
  const reading={elId:el.id,t:+((now-timer.lapStart)/1000).toFixed(2),obs,anormal:false,nc:+(ncOverlap(timer.lapStart,now)/1000).toFixed(2),ts:Date.now()};
  if(parcial)reading.parcial=true;
  c.leituras.push(reading);
  timer.undo.push({cycle:c,reading,prevLapStart:timer.lapStart,prevElIdx:timer.elIdx,prevCycleStart:timer.cycleStart,closed:false});
  drafts.obs="";
  timer.lapStart=now;timer.ncLog=timer.ncLog.filter(x=>x.e>now);
  return now;
}
function mark(){
  const s=cur();if(!s||!timer.running||!timer.cycle)return;
  const now=record(false);
  if(timer.elIdx>=s.elementos.length-1){closeCycle(now);buzz([40,60,40]);}
  else{timer.elIdx++;buzz(25);}
  scheduleSave(s);render();
}
function closeCycle(now){
  if(timer.nc)ncEnd(true,now);
  halt();
  const c=timer.cycle;
  if(timer.undo.length)timer.undo[timer.undo.length-1].closed=true;
  timer.lastClosed=c;timer.cycle=null;timer.elIdx=0;
  lockOff();
}
function undo(){
  const s=cur(),u=timer.undo.pop();if(!s||!u)return;
  const i=u.cycle.leituras.indexOf(u.reading);if(i>=0)u.cycle.leituras.splice(i,1);
  if(u.closed){timer.cycle=u.cycle;timer.cycleStart=u.prevCycleStart;timer.lastClosed=null;run();}
  timer.lapStart=u.prevLapStart;timer.elIdx=u.prevElIdx;
  if(u.reading.obs)drafts.obs=u.reading.obs;
  scheduleSave(s);toast(`Desfeito: “${elName(s,u.reading.elId)}” volta a contar`);render();
}
function ncStart(){
  const s=cur();if(!s||!timer.running||!timer.cycle||timer.nc)return;
  timer.nc={s:act(),elId:s.elementos[timer.elIdx].id,cycle:timer.cycle,tipo:"",obs:""};ncAdding=false;
  buzz([30,40,30]);render();
}
function ncEnd(silent,at){
  const s=cur(),nc=timer.nc;if(!s||!nc)return;
  const e=at!=null?at:act();
  const ob=$("#ncObsIn");if(ob)nc.obs=ob.value.trim();
  nc.cycle.ncs.push({id:uid(),tipo:nc.tipo,t:+((e-nc.s)/1000).toFixed(2),obs:nc.obs,elId:nc.elId,ts:Date.now()});
  timer.ncLog.push({s:nc.s,e});timer.nc=null;ncAdding=false;
  scheduleSave(s);
  if(!silent){toast(`NC registrada: ${fmt((e-nc.s)/1000,1)} s`);render();}
}
function askEnd(){
  if(!timer.cycle){endSession();toast("Cronometragem encerrada");return render();}
  confirmEnd={wasRunning:timer.running};halt();render();
}
function finishEnd(mode){
  const s=cur(),c=timer.cycle;if(!s||!c)return;
  if(mode==="back"){const w=confirmEnd&&confirmEnd.wasRunning;confirmEnd=null;if(w)run();return render();}
  if(mode==="close"){const now=record(false);closeCycle(now);}
  else if(mode==="partial"){
    if(timer.nc)ncEnd(true);
    if(act()-timer.lapStart>0)record(true);
  }else if(mode==="discard"){
    timer.nc=null;const i=s.ciclos.indexOf(c);if(i>=0)s.ciclos.splice(i,1);
  }
  endSession();
  toast(mode==="discard"?`Ciclo ${c.n} descartado`:mode==="partial"?`Ciclo ${c.n} salvo como incompleto`:`Ciclo ${c.n} fechado`);
  render();
}
function endSession(){
  const s=cur();
  timer.nc=null;halt();timer.actAcc=0;timer.lapStart=0;timer.cycleStart=0;timer.cycle=null;timer.elIdx=0;timer.ncLog=[];timer.undo=[];timer.lastClosed=null;
  confirmEnd=null;ncAdding=false;lockOff();
  if(s){s.ciclos=s.ciclos.filter(c=>c.leituras.length||c.ncs.length);s.ciclos.forEach((c,i)=>c.n=i+1);scheduleSave(s);}
}
function resetTimer(){timer.nc=null;halt();Object.assign(timer,{actAcc:0,lapStart:0,cycleStart:0,cycle:null,elIdx:0,ncLog:[],undo:[],lastClosed:null});confirmEnd=null;ncAdding=false;lockOff();drafts.obs="";drafts.qty="";}

const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const safeName=t=>t.replace(/[^\w\- .()À-ú]/g,"-").replace(/\s+/g," ").trim();
let dlPromise=null;
function getDownloads(){if(!dlPromise)dlPromise=PWA||!window.claude?Promise.resolve(null):Promise.resolve().then(()=>window.claude.use("downloads")).catch(()=>null);return dlPromise;}
function anchorDownload(blob,fname){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);}
// Salva um arquivo: no Claude usa o download da conta; no celular abre o menu de compartilhar; no computador baixa.
async function saveFile(blob,fname,forceDownload){
  const dl=await getDownloads();
  if(dl){
    try{const r=await dl.save({filename:fname,data:blob});return r&&r.status==="saved"?"saved":"cancel";}
    catch(e){const c=(e&&e.code)||"erro";if(c==="declined")return "cancel";throw new Error(c);}
  }
  if(!forceDownload&&matchMedia("(pointer:coarse)").matches&&navigator.canShare){
    try{const file=new File([blob],fname,{type:blob.type});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname});return "shared";}}
    catch(e){if(e&&e.name==="AbortError")return "cancel";}
  }
  anchorDownload(blob,fname);return "downloaded";
}
const saveMsg=r=>({saved:"Relatório salvo. No iPhone, escolha “Salvar em Arquivos”; no Android ele vai para Downloads.",shared:"Arquivo enviado. Salve na pasta da rede, no Drive ou no Teams.",downloaded:"Arquivo baixado na pasta Downloads.",cancel:"Cancelado."})[r]||"";
function buildXlsxFallback(s){
  const wb=XLSX.utils.book_new();
  C.sheets(s).forEach(sh=>{const ws=XLSX.utils.aoa_to_sheet(sh.aoa);ws["!cols"]=sh.cols.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,sh.name);});
  return XLSX.write(wb,{bookType:"xlsx",type:"array"});
}
function tsvReport(s){
  const sh=C.sheets(s);const pick=n=>sh.find(x=>x.name===n).aoa;
  const lines=[...pick("Resumo"),[],["CICLOS"],...pick("Ciclos"),[],["OBSERVAÇÕES"],...pick("Observações")];
  return lines.map(r=>r.map(x=>typeof x==="number"?String(x).replace(".",","):String(x??"").replace(/[\t\n]/g," ")).join("\t")).join("\n");
}
function showFallback(why){
  const m=$("#xlsxMsg");if(m)m.textContent=why+" Copie o relatório abaixo e cole na célula A1 de uma planilha.";
  const fb=$("#fbBox");if(fb){fb.hidden=false;$("#fbText").value=tsvReport(cur());}
}
async function exportXlsx(forceDownload){
  const s=cur(),msg=$("#xlsxMsg");
  let buf=null;
  if(window.ExcelJS&&window.CronoReport){try{const wb=await window.CronoReport.build(s,window.ExcelJS);buf=await wb.xlsx.writeBuffer();}catch(e){console.error(e);buf=null;}
    if(buf&&window.JSZip){try{buf=await window.CronoReport.addPivot(buf,s,window.JSZip);}catch(e){console.error("tabela dinâmica",e);}}}
  if(!buf){if(typeof XLSX==="undefined"){showFallback("O gerador de planilhas não carregou.");return;}buf=buildXlsxFallback(s);}
  const fname=safeName("Cronoanalise - "+(s.nome||"estudo")+" - "+(s.data||today()))+".xlsx";
  try{const r=await saveFile(new Blob([buf],{type:XLSX_MIME}),fname,forceDownload);msg.textContent=saveMsg(r);if(r!=="cancel")toast("Relatório gerado");}
  catch(e){showFallback("O salvamento falhou ("+e.message+").");}
}
async function exportConsol(){
  const sel=sortedIds().filter(id=>consolSel.has(id)).map(id=>studies[id]);
  const msg=$("#consolMsg");
  if(sel.length<2||!window.ExcelJS||!window.CronoConsol){if(msg)msg.textContent="Selecione pelo menos 2 estudos.";return;}
  const buf=await window.CronoConsol.build(sel,window.ExcelJS,window.JSZip,{groupBy:consolBy});
  const ops=[...new Set(sel.map(s=>String(s.operacao||"").trim()).filter(Boolean))];
  const fname=safeName("Consolidado - "+(ops.length===1?ops[0]:"cronoanalises")+" - "+today())+".xlsx";
  const r=await saveFile(new Blob([buf],{type:XLSX_MIME}),fname);
  if(msg)msg.textContent=saveMsg(r);
}
async function backup(){
  const data={app:"cronoanalise",v:1,exportado:new Date().toISOString(),cfg:{tiposNC:cfg.tiposNC.slice()},estudos:sortedIds().map(id=>studies[id])};
  const r=await saveFile(new Blob([JSON.stringify(data)],{type:"application/json"}),"Cronoanalise - backup - "+today()+".json");
  toast(r==="cancel"?"Backup cancelado":"Backup gerado");
}
async function importFiles(files){
  let add=0,upd=0,same=0;const bad=[];
  for(const f of files){
    let arr=null,cf=null;
    try{
      if(/\.json$/i.test(f.name)||f.type==="application/json"){const o=JSON.parse(await f.text());arr=Array.isArray(o)?o:o.estudos;cf=o.cfg;}
      else if(window.ExcelJS&&window.CronoReport){arr=await window.CronoReport.readEmbedded(await f.arrayBuffer(),window.ExcelJS);}
    }catch(e){console.error(e);}
    if(!Array.isArray(arr)){bad.push(f.name);continue;}
    if(cf&&Array.isArray(cf.tiposNC))cf.tiposNC.forEach(t=>{if(t&&!cfg.tiposNC.includes(t))cfg.tiposNC.push(t);});
    arr.forEach(raw=>{
      if(!raw||typeof raw!=="object")return;
      const s=C.normalize(JSON.parse(JSON.stringify(raw)));if(!s.id)s.id=uid();if(!s.atualizado)s.atualizado=Date.now();
      const ex=studies[s.id];
      if(ex&&(ex.atualizado||0)>=(s.atualizado||0)){same++;return;}
      if(timer.cycle&&s.id===curId){same++;return;}
      ex?upd++:add++;studies[s.id]=s;persist(s);
      s.ciclos.forEach(c=>c.ncs.forEach(n=>{if(n.tipo&&!cfg.tiposNC.includes(n.tipo))cfg.tiposNC.push(n.tipo);}));
    });
  }
  saveCfg();render();
  const parts=[];if(add)parts.push(`${add} ${add===1?"estudo novo":"estudos novos"}`);if(upd)parts.push(`${upd} atualizado(s)`);if(same)parts.push(`${same} já estava(m) aqui`);
  let t=parts.length?"Importado: "+parts.join(", ")+".":"Nada importado.";
  if(bad.length)t+=` ${bad.length} arquivo(s) sem estudo embutido (Excel de versão antiga ou de outra origem).`;
  toast(t,5000);
}

/* ---------- eventos ---------- */
let toastT;
function toast(t,ms){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms||2600);}
function newStudy(s){if(timer.cycle){toast("Encerre o ciclo em andamento antes");return;}studies[s.id]=s;persist(s);resetTimer();openStudy(s.id,"estudo");}
const pair=v=>v.split(":").map(Number);
function addTipo(v){v=String(v||"").trim();if(!v)return null;if(!cfg.tiposNC.includes(v)){cfg.tiposNC.push(v);saveCfg();}return v;}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b||b.disabled)return;
  const s=cur();
  if(b.id==="newBtn")return newStudy(blankStudy("Estudo "+(Object.keys(studies).length+1)));
  if(b.id==="markBtn")return mark();
  if(b.dataset.htab){homeTab=b.dataset.htab;render();window.scrollTo(0,0);return;}
  if(b.dataset.tab){if(view!=="study")return;tab=b.dataset.tab;confirmDel=false;render();window.scrollTo(0,0);return;}
  if(b.dataset.open)return openStudy(b.dataset.open,b.dataset.otab);
  if(b.dataset.by){consolBy=b.dataset.by;return render();}
  if(b.dataset.selop!=null){const op=b.dataset.selop;const ids=sortedIds().filter(id=>studies[id].ciclos.length&&((String(studies[id].operacao||"").trim()||"Sem operação")===op));
    const all=ids.every(id=>consolSel.has(id));ids.forEach(id=>all?consolSel.delete(id):consolSel.add(id));return render();}
  if(b.dataset.deltipo!=null){cfg.tiposNC.splice(+b.dataset.deltipo,1);saveCfg();return render();}
  const a=b.dataset.act;
  switch(a){
    case "home":{if(timer.cycle){toast("Encerre o ciclo em andamento antes de sair");return;}let st=null;try{st=history.state;}catch(e){}
      if(st&&st.v==="study"){try{history.back();}catch(e){}setTimeout(()=>{if(view!=="home")goHome();},300);}else goHome();return;}
    case "new":return newStudy(blankStudy("Estudo 1"));
    case "example":return newStudy(exampleStudy());
    case "import":return $("#fileIn").click();
    case "backup":return backup();
    case "addtipo":{if(addTipo($("#novoTipo").value))render();return;}
    case "resettipos":{cfg.tiposNC=C.NC_PADRAO.slice();saveCfg();toast("Lista padrão restaurada");return render();}
    case "install":{if(installEvt){installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;render();}return;}
    case "update":{if(swWaiting)swWaiting.postMessage("skipWaiting");return;}
    case "consol":{b.disabled=true;const old=b.innerHTML;b.textContent="Gerando planilha…";
      try{await exportConsol();}catch(e){console.error(e);const m=$("#consolMsg");if(m)m.textContent="Não consegui gerar o consolidado ("+((e&&e.message)||"erro")+").";}
      b.disabled=false;b.innerHTML=old;return;}
  }
  if(!s)return;
  switch(a){
    case "addel":{s.elementos.push({id:uid(),nome:"Elemento "+(s.elementos.length+1)});scheduleSave(s);render();const ins=document.querySelectorAll("[data-el]");const l=ins[ins.length-1];l&&l.focus();l&&l.select();return;}
    case "dup":{if(timer.cycle){toast("Encerre a cronometragem antes de duplicar");return;}const d=duplicateStudy(s);d.data=today();studies[d.id]=d;persist(d);curId=d.id;tab="estudo";confirmDel=false;render();window.scrollTo(0,0);toast("Estudo duplicado. Ajuste nome, turno, operador e data.");return;}
    case "del":confirmDel=true;return render();
    case "delno":confirmDel=false;return render();
    case "delyes":{resetTimer();await removeStudy(s.id);confirmDel=false;curId=null;view="home";toast("Estudo excluído");return render();}
    case "startcycle":return startCycle();
    case "qtyrep":{const lq=lastQty(s);if(lq!=null){drafts.qty=fmtQ(lq);const i=$("#qtyIn");if(i)i.value=drafts.qty;}return;}
    case "pause":halt();lockOff();return render();
    case "resume":run();return render();
    case "undo":return undo();
    case "stop":return askEnd();
    case "endclose":return finishEnd("close");
    case "endpartial":return finishEnd("partial");
    case "enddiscard":return finishEnd("discard");
    case "endback":return finishEnd("back");
    case "ncstart":return ncStart();
    case "ncend":return ncEnd(false);
    case "ncadd":{const ob=$("#ncObsIn");if(ob&&timer.nc)timer.nc.obs=ob.value;ncAdding=!ncAdding;render();const i=$("#ncNewType");i&&i.focus();return;}
    case "ncaddsave":{const ob=$("#ncObsIn");if(ob&&timer.nc)timer.nc.obs=ob.value;const v=addTipo($("#ncNewType").value);if(v&&timer.nc){timer.nc.tipo=v;ncAdding=false;toast(`Tipo “${v}” criado`);}return render();}
    case "showall":showAll=!showAll;return render();
    case "obslast":{
      const v=($("#obsIn").value||"").trim();if(!v)return;
      let last=null;for(let i=s.ciclos.length-1;i>=0&&!last;i--){const c=s.ciclos[i];if(c.leituras.length)last=c.leituras[c.leituras.length-1];}
      if(!last){toast("Registre uma leitura primeiro");return;}
      last.obs=last.obs?last.obs+"; "+v:v;drafts.obs="";scheduleSave(s);toast("Observação anotada");return render();
    }
    case "xlsx":case "xlsxdl":{b.disabled=true;const old=b.innerHTML;b.textContent="Gerando planilha…";$("#xlsxMsg").textContent="";
      try{await exportXlsx(a==="xlsxdl");}catch(e){showFallback("Não consegui montar a planilha ("+((e&&e.message)||"erro")+").");}
      b.disabled=false;b.innerHTML=old;return;}
    case "copytsv":{const txt=tsvReport(s);const ta=$("#fbText");ta.value=txt;
      try{await navigator.clipboard.writeText(txt);toast("Copiado. Cole na célula A1 do Excel");}
      catch(e){ta.focus();ta.select();toast("Texto selecionado: toque em Copiar no menu");}
      return;}
  }
  if(b.dataset.nctipo!=null&&timer.nc){const ob=$("#ncObsIn");if(ob)timer.nc.obs=ob.value;timer.nc.tipo=timer.nc.tipo===b.dataset.nctipo?"":b.dataset.nctipo;return render();}
  if(b.dataset.perfil!=null){s.perfil=b.dataset.perfil;scheduleSave(s);return render();}
  if(b.dataset.up){const i=s.elementos.findIndex(e=>e.id===b.dataset.up);if(i>0){[s.elementos[i-1],s.elementos[i]]=[s.elementos[i],s.elementos[i-1]];scheduleSave(s);render();}return;}
  if(b.dataset.delel){s.elementos=s.elementos.filter(e=>e.id!==b.dataset.delel);timer.elIdx=Math.min(timer.elIdx,s.elementos.length-1);scheduleSave(s);return render();}
  if(b.dataset.jump!=null){timer.elIdx=+b.dataset.jump;return render();}
  if(b.dataset.abn){const[ci,li]=pair(b.dataset.abn);const l=s.ciclos[ci].leituras[li];l.anormal=!l.anormal;scheduleSave(s);return render();}
  if(b.dataset.delr||b.dataset.delnc){
    const[ci,i]=pair(b.dataset.delr||b.dataset.delnc);const c=s.ciclos[ci];
    if(b.dataset.delr){const r=c.leituras.splice(i,1)[0];timer.undo=timer.undo.filter(u=>u.reading!==r);}else c.ncs.splice(i,1);
    if(!c.leituras.length&&!c.ncs.length&&c!==timer.cycle&&!(timer.nc&&timer.nc.cycle===c)){s.ciclos.splice(ci,1);s.ciclos.forEach((x,k)=>x.n=k+1);}
    scheduleSave(s);return render();
  }
});

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="busca"){busca=t.value;const pos=t.selectionStart;render();const n=$("#busca");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}
  const s=cur();if(!s||view!=="study")return;
  if(t.id==="obsIn"){drafts.obs=t.value;saveTimer();return;}
  if(t.id==="qtyIn"){drafts.qty=t.value;return;}
  if(t.id==="ncObsIn"&&timer.nc){timer.nc.obs=t.value;return;}
  if(t.dataset.f&&t.tagName!=="SELECT"){const k=t.dataset.f;s[k]=(t.type==="number")?(t.value===""?"":+t.value):t.value;
    if(k==="nome"){const h=document.querySelector(".bar-title b");if(h)h.textContent=s.nome;}
    scheduleSave(s);}
  else if(t.dataset.el){const e=s.elementos.find(x=>x.id===t.dataset.el);if(e){e.nome=t.value;scheduleSave(s);}}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="fileIn"){const fs=[...t.files];t.value="";if(fs.length)importFiles(fs);return;}
  if(t.dataset.sel){t.checked?consolSel.add(t.dataset.sel):consolSel.delete(t.dataset.sel);return render();}
  const s=cur();if(!s)return;
  if(t.dataset.f==="unidade"){s.unidade=t.value;scheduleSave(s);return render();}
  if(t.dataset.qty!=null){const c=s.ciclos[+t.dataset.qty];const v=parseQty(t.value);if(c&&v!==undefined){c.qtd=v;scheduleSave(s);render();}else toast("Quantidade inválida");return;}
  if(t.dataset.nctype){const[ci,ni]=pair(t.dataset.nctype);const x=s.ciclos[ci]&&s.ciclos[ci].ncs[ni];if(x){x.tipo=t.value;scheduleSave(s);}return;}
});
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter")return;
  const id=ev.target.id;
  if(id==="obsIn"||id==="ncObsIn"||id==="qtyIn"||id==="busca"){ev.preventDefault();ev.target.blur();}
  else if(id==="novoTipo"){ev.preventDefault();document.querySelector('[data-act="addtipo"]')?.click();}
  else if(id==="ncNewType"){ev.preventDefault();document.querySelector('[data-act="ncaddsave"]')?.click();}
  else if(ev.target.dataset&&ev.target.dataset.qty!=null){ev.preventDefault();ev.target.blur();}
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){flushSaves();saveTimer();}
  else if(timer.running){lockOn();tick();}
});
window.addEventListener("pagehide",()=>{flushSaves();saveTimer();});

/* ---------- instalação e atualização (PWA) ---------- */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(view==="home"&&homeTab==="ajustes")render();});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("App instalado");});
window.addEventListener("online",()=>{if(view==="home"&&homeTab==="ajustes")render();});
window.addEventListener("offline",()=>{if(view==="home"&&homeTab==="ajustes")render();});
window.CronoUI={swUpdate(w){swWaiting=w;toast("Nova versão disponível: veja em Ajustes",4000);if(view==="home"&&homeTab==="ajustes")render();}};

try{history.replaceState({v:"home"},"");}catch(e){}
render();
initStore();
getDownloads();
})();

</script>
